<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lightning Machine</title>
<meta name="description" content="Full-screen real-time Tesla-coil lightning. Field-guided arcs with Gaussian jaggedness and black-body colour, computed in Rust/WebAssembly and drawn with WebGL2.">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="view"></canvas>

<div id="dock">
  <button id="btn-menu" title="Controller (H)">⚙</button>
  <button id="btn-sound" title="Sound (S)">🔈</button>
  <button id="btn-mic" title="Microphone (M)">🎤<i id="mic-bar"></i></button>
  <button id="btn-fs" title="Fullscreen (F)">⛶</button>
</div>

<aside id="panel">
  <header><b>⚡ Controller</b><button id="btn-close" title="Hide (Esc)">✕</button></header>
  <div id="modes">
    <button data-mode="0" title="1">Roam</button>
    <button data-mode="1" title="2">Follow finger</button>
    <button data-mode="2" title="3">Two coils</button>
  </div>
  <div id="controls"></div>
  <p class="hint">Touch / click anywhere to pull an arc to your finger. Controls hide automatically.<br>Keys: H panel · F fullscreen · S sound · M mic · 1-3 modes</p>
</aside>
<script type="module" src="js/app.js"></script>
</body>
</html>
