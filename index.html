<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lightning Machine</title>
<meta name="description" content="Clean lightning in a glass chamber: 3-D stepped leaders with quantum (Fowler–Nordheim) tunnelling, channels that connect to each other, Heidler/MTLE return strokes, air-plasma spectral colour, Fresnel glass reflections, lava-lamp convection. Rust/WebAssembly + WebGL2.">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="view"></canvas>

<div id="dock">
  <button id="btn-strike" title="Strike (Space)">⚡</button>
  <button id="btn-menu" title="Controller (H)">⚙</button>
  <button id="btn-sound" title="Sound (S)">🔈</button>
  <button id="btn-mic" title="Microphone (M)">🎤<i id="mic-bar"></i></button>
  <button id="btn-fs" title="Fullscreen (F)">⛶</button>
</div>

<aside id="panel">
  <header><b>⚡ Controller</b><button id="btn-close" title="Hide (Esc)">✕</button></header>
  <div class="tb"><canvas id="tbar"></canvas><span>1 500 K</span><span>emission spectra: air · Ne · Ar · Xe · He · Hg · Kr</span><span>40 000 K</span></div>
  <div id="controls"></div>
  <p class="hint">The screen is the glass of the chamber. Drag to look around inside · tap to strike. Controls hide automatically.<br>Keys: Space strike · H panel · F fullscreen · S sound · M mic</p>
</aside>
<script type="module" src="js/app.js"></script>
</body>
</html>
